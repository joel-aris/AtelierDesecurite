services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_office
      POSTGRES_USER: secure_office
      POSTGRES_PASSWORD: secure_office
    ports:
      - "55432:5432"
    volumes:
      - secure_office_postgres_data:/var/lib/postgresql/data

volumes:
  secure_office_postgres_data:
